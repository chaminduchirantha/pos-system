        <section id="customer-content">
            <div class="container mt-4">
                <div class="row mb-3 text-center">
                   <h1 style="color:wheat"> <i class="fa-solid fa-users" style="color: wheat; margin: 15px"></i>Customer</h1>
                </div>

                <div class="row">
                    <div class="col-lg-6 d-flex flex-wrap gap-3 justify-content-center ">
                        <div class="card p-4 shadow-sm h-100 w-100 border border-primary border border-3 " style="border-radius:20px; background-color: rgba(11,34,49,0.27)">
                            <h4 class="mb-4 d-flex flex-wrap gap-3 justify-content-center text-primary">Customer Form</h4>
                            <form class="row g-3 custome-form">
                                <div class="col-md-6">
                                    <input type="text" class="form-control border border-primary border border-1" placeholder="Customer Id" id="custId">
                                </div>
                                <div class="col-md-6">
                                    <input type="text" class="form-control border border-primary border border-1" placeholder="Customer First Name" id="fname">
                                </div>
                                <div class="col-md-6">
                                    <input type="text" class="form-control border border-primary border border-1" placeholder="Customer Last Name" id="lname">
                                </div>
                                <div class="col-md-6">
                                    <input type="number" class="form-control border border-primary border border-1" placeholder="Customer Salary" id="salary">
                                </div>
                                <div class="col-md-12">
                                    <textarea type="text" class="form-control border border-primary border border-1" placeholder="Customer Address" id="address"></textarea>
                                </div>
                                <div class="col-12 ">
                                    <button type="button" class="btn btn-success" id="customerSave">Save</button>
                                    <button type="button" class="btn btn-warning" id="customerUpdate">Update</button>
                                    <button type="button" class="btn btn-danger" id="customerDelete">Delete</button>
                                    <button type="button" class="btn btn-secondary" id="customerReset">reset</button>
                                </div>
                            </form>
                        </div>
                    </div>



                    <div class="col-lg-6 col-md-12">
                        <div class="card my-4">
                            <table class="table table-bordered custom-Table customer-table">
                                <thead>
                                <tr>
                                    <th scope="col">ID</th>
                                    <th scope="col">First Name</th>
                                    <th scope="col">Last Name</th>
                                    <th scope="col">Address</th>
                                    <th scope="col">Salary</th>
                                </tr>
                                </thead>
                                <tbody id="customer-tbody">
                                <tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </section>


        <section id="items-content">
            <div class="container mt-4 ">
                <div class="row mb-3 text-center">
                    <h1  style="color:wheat"><i class="fa-solid fa-burger" style="color: wheat; margin: 15px"></i>Item</h1>
                </div>
                <div class="row">
                    <div class="col-lg-6 d-flex flex-wrap gap-3 justify-content-center">
                        <div class="card p-4 shadow-sm h-100 w-100 border border-warning border border-3 "  style="border-radius:20px; background-color: rgba(11,34,49,0.27)">
                            <div class="card-body custom-card ">
                                <h4 class="mb-4 d-flex flex-wrap gap-3 justify-content-center text-warning">Item Form</h4>                                <br>
                                <form class="row g-3">
                                    <div class="col-md-6 ">
                                        <input type="text" class="form-control border border-warning border border-1" id="itemId" placeholder="Item ID">
                                    </div>
                                    <div class="col-md-6 ">
                                        <input type="text" class="form-control border border-warning border border-1" id="item-name" placeholder="Item Name">
                                    </div>
                                    <div class="col-md-6 ">
                                        <input type="number" class="form-control border border-warning border border-1" id="item-price" placeholder="Item Price">
                                    </div>
                                    <div class="col-md-6 ">
                                        <input type="number" class="form-control border border-warning border border-1" id="item-qty" placeholder="Item Quantity">
                                    </div>

                                    <div class="mt-3">
                                        <button type="button" class="btn btn-primary" id="item-Save">Save</button>
                                        <button type="button" class="btn btn-warning" id="itemUpdate">Update</button>
                                        <button type="button" class="btn btn-success" id="itemClear">Clear</button>
                                        <button type="button" class="btn btn-danger" id="itemDelete">Delete</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-12">
                        <div class="card my-4">
                            <table class="table table-bordered">
                                <thead>
                                <tr>
                                    <th scope="col">ItemID</th>
                                    <th scope="col">ItemName</th>
                                    <th scope="col">Price</th>
                                    <th scope="col">Quantity</th>
                                </tr>
                                </thead>
                                <tbody id="itemTbody">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </section>


    <section id="orders-content">
        <div class="container mt-4 ">
            <div class="row mb-3 text-center">
                <h1  style="color:wheat"><i class="fa-solid fa-cart-shopping" style="color: wheat; margin: 15px"></i>Place Order</h1>
            </div>
            <div class="row">
                <div class="col-lg-6 d-flex flex-wrap gap-3 justify-content-center">
                    <div class="card p-4 shadow-sm h-100 w-100 border border-success border border-3 "  style="border-radius:20px; background-color: rgba(11,34,49,0.27)">
                        <div class="card-body custom-card ">
                            <h4 class="mb-4 d-flex flex-wrap gap-3 justify-content-center text-success">Place Order Form</h4>                                <br>
                            <form class="row g-3">
                                <div class="col-md-6 ">
                                    <input type="text" class="form-control border border-success border border-2" id="orderId" placeholder="order ID">
                                </div>
                                <div class="col-md-6 ">
                                    <input type="text" class="form-control border border-success border border-2" id="customerId" placeholder="customer Id">
                                </div>
                                <div class="col-md-6 ">
                                    <input type="text" class="form-control border border-success border border-2" id="order-itemId" placeholder="Item Id">
                                </div>
                                <div class="col-md-6 ">
                                    <input type="number" class="form-control border border-success border border-2" id="order-itemQuantity" placeholder="Quantity On Hand">
                                </div>
                                <div class="col-md-6 ">
                                    <input type="text" class="form-control border border-success border border-2" id="order-itemDesc" placeholder="Item Description">
                                </div>

                                <div class="mt-3">
                                    <button type="button" class="btn btn-success">place Order</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6 col-md-12">
                    <div class="card my-4">
                        <table class="table table-bordered">
                            <thead>
                            <tr>
                                <th scope="col">order Id</th>
                                <th scope="col">customer Id</th>
                                <th scope="col">Item Id</th>
                                <th scope="col">Item Quantity</th>
                                <th scope="col">Item Description</th>
                            </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>
